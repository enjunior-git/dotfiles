source-file ~/.config/tmux/tmux.reset.conf

# Make sesh work
set-environment -g PATH "$HOME/.cargo/bin:$PATH"
set-environment -g PATH "$HOME/go/bin:$PATH"

# Set prefix
unbind C-b
set -g prefix \`
bind \` send-prefix

# Terminal colours
set-option -ga terminal-overrides ",xterm-256color:Tc"

# set -g default-terminal "${TERM}"
# set -sg terminal-overrides ";*:RGB"
# set-option -sa terminal-overrides ',xterm*:Tc'
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar
set -g status-style bg=#1E1E2E,fg=#9ca0b0,bright
set -g status-left ""
set -g status-right "#[fg=#9ca0b0,bright]#S"

set -g window-status-format " ◯ #W "
set -g window-status-current-format " ● #W "

set -g window-status-current-style \
    "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"

set -g window-status-bell-style "fg=red,nobold"

# Pane separators
# set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# # Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# QOL
set -g repeat-time 1000
set -g mouse on                  # Mouse support
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top

setw -g mode-keys vi

# Keybindings
bind - split-window -v
bind | split-window -h

bind f resize-pane -Z

bind-key "R" source-file ~/.config/tmux/tmux.conf \;  # reload config file
bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @continuum-restore 'on'
# set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'


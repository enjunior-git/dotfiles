general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/junior/.config/hypr/lock-wallpaper.jpg
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 88
    font_family = Sans
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(bac2deff)
    font_size = 22
    font_family = Sans
    position = 0, 34
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    placeholder_text = Password
    placeholder_color = rgba(7f849cff)
    check_color = rgba(89dcebff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    hide_input = false
    rounding = 12
    shadow_passes = 0
    position = 0, -52
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked
    color = rgba(a6adc8ff)
    font_size = 18
    font_family = Sans
    position = 0, -118
    halign = center
    valign = center
}
